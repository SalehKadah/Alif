name: Alif Unix Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        BUILD-CONFIGURATION: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: make
        run: cd linuxBuild && make ${{matrix.BUILD-CONFIGURATION}}

      # البناء وحده لا يكشف علل وقت التشغيل، فنشغّل الأمثلة والاختبارات
      - name: اختبارات الدخان
        run: bash .github/scripts/smoke_test.sh linuxBuild/build/alif

  macos-build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        BUILD-CONFIGURATION: [debug, release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # lfs: true

      - name: make
        run: cd linuxBuild && make ${{matrix.BUILD-CONFIGURATION}}

      - name: اختبارات الدخان
        run: bash .github/scripts/smoke_test.sh linuxBuild/build/alif
