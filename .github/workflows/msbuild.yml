name: Alif Windows Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: winBuild/Alif.sln

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        BUILD-CONFIGURATION: [Release]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: بناء وتشغيل التهيئات الأربع
        shell: bash
        run: |
          set +e
          MSB=$(find "/c/Program Files/Microsoft Visual Studio" -name MSBuild.exe -path "*Current/Bin*" -print 2>/dev/null | grep -v amd64 | head -1)
          echo "msbuild: $MSB"
          EX="examples/BallFallSim.alif"
          for CFG in Debug Release; do
            for PLAT in Win32 x64; do
              echo "############ $CFG|$PLAT"
              MSYS_NO_PATHCONV=1 "$MSB" -m -p:Configuration=$CFG -p:Platform=$PLAT winBuild/Alif.sln > b.log 2>&1
              echo "بناء rc=$?"
              tail -4 b.log
              EXE=$(ls winBuild/*/$CFG/alif.exe winBuild/$CFG/alif.exe 2>/dev/null | head -1)
              echo "التنفيذي: $EXE"
              if [ -n "$EXE" ]; then
                ( ./$EXE ) > o.txt 2> e.txt; echo "بلا وسائط rc=$?"; echo "[out]"; head -6 o.txt; echo "[err]"; head -6 e.txt
                ( ./$EXE "$EX" ) > o.txt 2> e.txt; echo "بمثال rc=$?"; echo "[out]"; head -6 o.txt; echo "[err]"; head -6 e.txt
              fi
            done
          done
