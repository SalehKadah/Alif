name: Alif Windows Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: winBuild/Alif.sln

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        BUILD-CONFIGURATION: [Release]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild /m /p:Configuration=${{matrix.BUILD-CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

      - name: فحص مواضع التشغيل
        shell: bash
        run: |
          set +e
          EXE="winBuild/x64/Release/alif.exe"
          EX=$(git -c core.quotepath=false ls-files 'examples/*.alif' | head -1)
          echo "### المثال: $EX"
          try() {
            echo "----- $1"
            shift
            ( "$@" ) > o.txt 2> e.txt
            echo "rc=$?"
            echo "[out] $(wc -c < o.txt) بايت"; head -20 o.txt
            echo "[err] $(wc -c < e.txt) بايت"; head -20 e.txt
          }
          try "1. من جذر المستودع، مفسر مجلد البناء" ./$EXE "$EX"
          try "2. النسخة التي وضعها البناء في examples" ./examples/alif.exe "$EX"
          try "3. من داخل examples" bash -c 'cd examples && ./alif.exe "$(ls *.alif | head -1)"'
          try "4. بلا وسائط" ./$EXE
          try "5. حزمة مجهزة جانبها library" bash -c 'P=$(mktemp -d); cp winBuild/x64/Release/alif.exe "$P/"; cp -r library "$P/"; printf %s "اطبع(1)" > "$P/t.alif"; cd "$P" && ./alif.exe t.alif'
          echo "----- 6. اعتماديات الملف التنفيذي"
          dumpbin //dependents "$EXE" 2>&1 | head -30
          echo "----- 7. ما وضعه البناء في examples"
          ls -l examples/*.exe examples/*.dll 2>/dev/null
