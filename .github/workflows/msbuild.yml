# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Alif Windows Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # زر تشغيل يدوي: يتيح تجربة البناء على أي فرع بلا فتح طلب دمج.
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "winBuild/Alif.sln"

permissions:
  contents: read

jobs:
  build:
    # عداء مستضاف لدى GitHub بدل عداء ذاتي الاستضافة: الذاتي لا يلتقط
    # وظائف الفروع وطلبات الدمج إلا حين يكون جهازه متصلاً، ويشغّل شيفرة
    # الطلبات الواردة على ذلك الجهاز.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        BUILD-CONFIGURATION: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # lfs: true

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # تُذكر المنصة صراحةً بدل الاتكال على التهيئة الافتراضية في الحل.
      # ويستحق الانتباه أن تهيئة Release|Win32 في FreezeModule.vcxproj وحدها
      # بلا PostBuildEvent، فمن بنى بها لا يتولد عنده GetPath.h.
      - name: Build
        run: msbuild /m /p:Configuration=${{matrix.BUILD-CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

      - name: تشغيل ما بُني
        shell: bash
        run: |
          set +e
          EXE="winBuild/x64/${{matrix.BUILD-CONFIGURATION}}/alif.exe"
          try() { echo "----- $1"; shift; ( "$@" ) > o.txt 2> e.txt; echo "rc=$?"; echo "[out]"; head -8 o.txt; echo "[err]"; head -8 e.txt; }
          T=$(mktemp -d); printf 'اطبع("سليم")
' > "$T/t.alif"
          try "1. برنامج صغير" ./$EXE "$T/t.alif"
          try "2. بلا وسائط" ./$EXE
          try "3. ملف عربي الاسم" bash -c 'T=$(mktemp -d); printf %s "اطبع(\"سليم\")" > "$T/تجربة.alif"; winBuild/x64/'"${{matrix.BUILD-CONFIGURATION}}"'/alif.exe "$T/تجربة.alif"'
