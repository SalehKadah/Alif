# separate terms of service, privacy policy, and support
# documentation.

name: Alif Windows Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # زر تشغيل يدوي: يتيح تجربة البناء على أي فرع بلا فتح طلب دمج.
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "winBuild/Alif.sln"

permissions:
  contents: read

jobs:
  build:
    # عداء مستضاف لدى GitHub بدل عداء ذاتي الاستضافة: الذاتي لا يلتقط
    # وظائف الفروع وطلبات الدمج إلا حين يكون جهازه متصلاً، ويشغّل شيفرة
    # الطلبات الواردة على ذلك الجهاز.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        BUILD-CONFIGURATION: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # lfs: true

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # تُذكر المنصة صراحةً بدل الاتكال على التهيئة الافتراضية في الحل.
      # ويستحق الانتباه أن تهيئة Release|Win32 في FreezeModule.vcxproj وحدها
      # بلا PostBuildEvent، فمن بنى بها لا يتولد عنده GetPath.h.
      - name: Build
        run: msbuild /m /p:Configuration=${{matrix.BUILD-CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

      # بناء Debug يفعّل AddressSanitizer، فيعتمد الملف التنفيذي على
      # clang_rt.asan_dynamic-x86_64.dll وهي في مجلد أدوات MSVC لا في مسار
      # النظام، فلا يبدأ البرنامج أصلاً بدونها. إضافتها تُبقي ASAN عاملاً
      # أثناء الاختبارات بدل تعطيله.
      - name: إضافة وقت تشغيل ASAN إلى المسار
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $dir = "$vs\VC\Tools\MSVC\$ver\bin\Hostx64\x64"
          if (-not (Test-Path "$dir\clang_rt.asan_dynamic-x86_64.dll")) {
            throw "لم يُعثر على وقت تشغيل ASAN في $dir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      # البناء يثبت الترجمة لا التشغيل، فنشغّل ما بُني
      - name: تشخيص
        if: matrix.BUILD-CONFIGURATION == 'Release'
        shell: bash
        run: bash diag.sh

      - name: تشغيل ما بُني
        shell: bash
        run: bash .github/scripts/run_check.sh "winBuild/x64/${{matrix.BUILD-CONFIGURATION}}/alif.exe"
