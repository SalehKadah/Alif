name: Alif Windows Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "winBuild/Alif.sln"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        BUILD-CONFIGURATION: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # lfs: true

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild /m /p:Configuration=${{matrix.BUILD-CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

      # البناء وحده لا يكشف علل وقت التشغيل، فنشغّل الأمثلة والاختبارات
      - name: اختبارات الدخان
        shell: bash
        run: bash .github/scripts/smoke_test.sh "winBuild/x64/${{matrix.BUILD-CONFIGURATION}}/alif.exe"
